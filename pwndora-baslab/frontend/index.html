<!doctype html>
<html lang="en" class="dark">
  <!-- The `dark` class is the default; src/lib/theme.ts replaces it from
       localStorage before React mounts, so a stored light preference does not
       flash dark on load. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="PWNDORA BASLab — Breach & Attack Simulation training module by BlackPerl DFIR."
    />
    <!--
      No webfont link is present by design. The judging environment requires zero
      external calls, so the monospace/sans stacks in tailwind.config.js resolve
      against locally installed fonts (JetBrains Mono or Fira Code when available,
      Consolas/ui-monospace otherwise).
    -->
    <title>PWNDORA BASLab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
